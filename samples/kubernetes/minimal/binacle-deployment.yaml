apiVersion: apps/v1
kind: Deployment
metadata:
  name: binacle-net
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binacle-net
  template:
    metadata:
      labels:
        app: binacle-net
    spec:
      containers:
        - name: binacle-net
          # Pinned on purpose - a copied sample must not jump to a new major on the next pull. Pinned to the
          # beta patch for now because binacle/binacle-net:3.0 does not exist on Docker Hub yet - move to the
          # 3.0 minor tag once v3.0.0 is published.
          image: binacle/binacle-net:3.0.0-beta.1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: presets-volume
              mountPath: /app/Config_Files/Presets.json
              subPath: Presets.json
              readOnly: true
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: presets-volume
          configMap:
            name: binacle-presets
            items:
              - key: Presets.json
                path: Presets.json
        - name: data-volume
          persistentVolumeClaim:
            claimName: binacle-data-pvc
