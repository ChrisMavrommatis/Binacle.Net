name: binacle-net-minimal

# Binacle.Net sample: minimal
#
# This configuration is smoke-tested against the image on every release, so it is a shape that is
# proven to work rather than one nobody checks.

services:
  binacle-net:
    # Pinned on purpose - a copied sample must not jump to a new major on the next pull. Pinned to the beta
    # patch for now because binacle/binacle-net:3.0 does not exist on Docker Hub yet - move to the 3.0 minor
    # tag once v3.0.0 is published.
    image: binacle/binacle-net:3.0.0-beta.4
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./Presets.json
        target: /app/Config_Files/Presets.json
        read_only: true
      - type: bind
        source: ./data
        target: /app/data
