links:
  - type: 'text/css'
    rel: 'stylesheet'
    href: '/lib/beercss/beer.min.css'
  - type: 'text/css'
    rel: 'stylesheet'
    href: '/css/main.css'


scripts_body_end:
  - src: '/lib/beercss/beer.min.js'
    type: 'module'
#   We recommend using the material-dynamic-colors only when your app needs to change theme at runtime
#  - src: '/lib/material-dynamic-colors/material-dynamic-colors.min.js'
#    type: 'module'
  - src: "/js/runtime.js"
    type: "text/javascript"
  - src: '/js/main.js'
    type: 'text/javascript'
  - src: '/js/vendors.js'
    type: 'text/javascript'


#   What only the two app pages execute - three.js alone is 524 KiB. `demo: true` in a page's front matter
#   loads them; every other page prefetches this same list instead, so arriving at a demo costs no
#   download. One list, so the two can never drift.
demo_scripts:
  - src: '/js/three.js'
    type: 'text/javascript'
  - src: '/js/binacle-net-ui.js'
    type: 'text/javascript'
  - src: '/js/binacle-vipaq.js'
    type: 'text/javascript'
