# container-structure-test - static image content for binacle-net.
# Runs without a running container (works on --driver tar). "This is how the image is supposed to be shipped."
# This is a complete declaration on purpose - it asserts every shipped file even where a dynamic test would
# also catch a regression, because it says "this is how the image is supposed to be shipped". The Smoke section
# of tooling/README.md has the rules that decide what belongs here.

schemaVersion: 2.0.0

fileExistenceTests:
  # The nine shipped config files.
  - name: appsettings.json
    path: /app/Config_Files/appsettings.json
    shouldExist: true
  - name: Presets.json
    path: /app/Config_Files/Presets.json
    shouldExist: true
  - name: ForwardedHeaders.json
    path: /app/Config_Files/ForwardedHeaders.json
    shouldExist: true
  - name: HealthChecks.json
    path: /app/Config_Files/DiagnosticsModule/HealthChecks.json
    shouldExist: true
  - name: OpenTelemetry.json
    path: /app/Config_Files/DiagnosticsModule/OpenTelemetry.json
    shouldExist: true
  - name: PackingLogs.json
    path: /app/Config_Files/DiagnosticsModule/PackingLogs.json
    shouldExist: true
  - name: Serilog.json
    path: /app/Config_Files/DiagnosticsModule/Serilog.json
    shouldExist: true
  - name: RateLimiter.json
    path: /app/Config_Files/ServiceModule/RateLimiter.json
    shouldExist: true
  - name: UiModule/ConnectionStrings.json
    path: /app/Config_Files/UiModule/ConnectionStrings.json
    shouldExist: true
  - name: the app itself
    path: /app/Binacle.Net.dll
    shouldExist: true

  # The writable data dir is created by the Dockerfile and chowned to the app user (uid 1654). A dropped chown
  # here silently turns file logging into a no-op.
  - name: data dir owned by uid 1654
    path: /app/data
    shouldExist: true
    uid: 1654
    gid: 1654

  # No development overrides may ship - .dockerignore strips them; they are present in the publish output, so
  # this proves the ignore rule holds.
  - name: no Cors.Development.json
    path: /app/Config_Files/Cors.Development.json
    shouldExist: false
  - name: no HealthChecks.Development.json
    path: /app/Config_Files/DiagnosticsModule/HealthChecks.Development.json
    shouldExist: false
  - name: no OpenTelemetry.Development.json
    path: /app/Config_Files/DiagnosticsModule/OpenTelemetry.Development.json
    shouldExist: false
  - name: no PackingLogs.Development.json
    path: /app/Config_Files/DiagnosticsModule/PackingLogs.Development.json
    shouldExist: false
  - name: no Serilog.Development.json
    path: /app/Config_Files/DiagnosticsModule/Serilog.Development.json
    shouldExist: false
  - name: no ServiceModule/ConnectionStrings.Development.json
    path: /app/Config_Files/ServiceModule/ConnectionStrings.Development.json
    shouldExist: false
  - name: no ServiceModule/JwtAuth.Development.json
    path: /app/Config_Files/ServiceModule/JwtAuth.Development.json
    shouldExist: false

  # Absent by design - only their .Development variants exist in source. The deploy injects JwtAuth.json.
  - name: no Cors.json
    path: /app/Config_Files/Cors.json
    shouldExist: false
  - name: no ServiceModule/JwtAuth.json
    path: /app/Config_Files/ServiceModule/JwtAuth.json
    shouldExist: false
  - name: no ServiceModule/ConnectionStrings.json
    path: /app/Config_Files/ServiceModule/ConnectionStrings.json
    shouldExist: false

fileContentTests:
  # Toggles with no HTTP route - static is the only place their shipped-off state is asserted.
  - name: ForwardedHeaders ships off
    path: /app/Config_Files/ForwardedHeaders.json
    expectedContents: ['"Enabled"\s*:\s*false']
  - name: PackingLogs ships off
    path: /app/Config_Files/DiagnosticsModule/PackingLogs.json
    expectedContents: ['"Enabled"\s*:\s*false']
  - name: OpenTelemetry ships off
    path: /app/Config_Files/DiagnosticsModule/OpenTelemetry.json
    expectedContents: ['"Enabled"\s*:\s*false']

  # Security-relevant shipped defaults.
  - name: HealthChecks ships off and restricts nobody
    path: /app/Config_Files/DiagnosticsModule/HealthChecks.json
    expectedContents:
      - '"Enabled"\s*:\s*false'
      - '"RestrictedIPs"\s*:\s*\[\]'
  - name: AllowedHosts is the wildcard default
    path: /app/Config_Files/appsettings.json
    expectedContents: ['"AllowedHosts"\s*:\s*"\*"']
  - name: UI connection string ships empty
    path: /app/Config_Files/UiModule/ConnectionStrings.json
    expectedContents: ['"BinacleApi"\s*:\s*""']

  # Log paths must stay under data/, which pairs with the /app/data ownership check.
  - name: Serilog writes under data/logs
    path: /app/Config_Files/DiagnosticsModule/Serilog.json
    expectedContents: ['data/logs/']
  - name: PackingLogs writes under data/pack-logs
    path: /app/Config_Files/DiagnosticsModule/PackingLogs.json
    expectedContents: ['data/pack-logs/']

  # Rate-limit keys present and non-empty - the key is packaging, the number is behaviour (left to integration).
  - name: rate-limit keys present and non-empty
    path: /app/Config_Files/ServiceModule/RateLimiter.json
    expectedContents:
      - '"ApiUsageAnonymous"\s*:\s*"[^"]+"'
      - '"AuthToken"\s*:\s*"[^"]+"'
      - '"ApiUsageDemoSubscription"\s*:\s*"[^"]+"'

metadataTest:
  entrypoint: ["dotnet", "Binacle.Net.dll"]
  workdir: /app
  user: "1654"
  envVars:
    - key: BINACLE_VERSION
      value: ".+"
      isRegex: true
  labels:
    - key: org.opencontainers.image.title
      value: Binacle.Net
    - key: org.opencontainers.image.source
      value: https://github.com/ChrisMavrommatis/Binacle.Net
    # The check that catches the NOASSERTION regression the live 2.1.1 image ships.
    - key: org.opencontainers.image.licenses
      value: GPL-3.0-only AND CC-BY-SA-4.0
    - key: org.opencontainers.image.version
      value: ".+"
      isRegex: true
    - key: org.opencontainers.image.revision
      value: ".+"
      isRegex: true
