# Keeps the SHA-pinned actions moving. A pin without automation is a pin that rots: it stays on whatever
# commit it was set to and stops getting security fixes, which is worse than a floating tag because nothing
# reports it. Dependabot rewrites the SHA and the trailing `# vX.Y.Z` comment together, so the comment stays
# honest.
#
# Actions only, on purpose. NuGet is managed centrally in Directory.Packages.props and npm is a small dev-only
# set - both are reviewed by hand, and adding them here would bury the action updates in noise.
#
# One entry per directory, and they are not interchangeable. `directory: /` reaches `.github/workflows` and a
# root-level `action.yml` - nothing under `.github/actions/`, and `directories:` with a glob is not available
# for this ecosystem. A composite action that pins a SHA and has no entry below stops being updated silently.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A broken update must name the action that broke it - but only a major can really break one, so only a
    # major needs its own PR. Minor and patch on these actions are almost entirely toolkit churn; batching
    # them costs no blame and keeps them from filling the queue. Anything not matched by a group still gets
    # an individual PR, so majors arrive one at a time on their own.
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Headroom for a week where several majors land together - each one is its own PR, and at 5 the sixth
    # silently never opens.
    open-pull-requests-limit: 10
    labels:
      - dependencies
      # Quoted on purpose: an unquoted `area: ci-cd` in a list is a YAML map, not the string the label needs.
      - "area: ci-cd"
    commit-message:
      prefix: ci

  # The four composite actions that pin a SHA. setup-dotnet pins two.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-dotnet
    schedule:
      interval: weekly
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - "area: ci-cd"
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-just
    schedule:
      interval: weekly
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - "area: ci-cd"
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-node
    schedule:
      interval: weekly
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - "area: ci-cd"
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-ruby
    schedule:
      interval: weekly
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - "area: ci-cd"
    commit-message:
      prefix: ci
