name: Deploy Binacle.Net Docs
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Binacle.Net Docs
    runs-on: ubuntu-latest
    # A tag push and a DigitalOcean deploy trigger. Neither is long-running.
    timeout-minutes: 20
    environment:
      name: binacle-net-docs
      url: https://docs.binacle.net
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag Commit for Docs Deployment
        run: |
          # The prefix must not start with `v` followed by a digit: release-docker-image.yml fires
          # on `v[0-9]*` and would build and publish an image from this deploy tag.
          TAG_NAME="docs-release-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" $GITHUB_SHA
          git push origin "$TAG_NAME"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: 'binacle-net-docs'


