# Smokes an image that already exists on a registry: its static content, then every shipped profile end to end.
# Run by hand against any published tag, and called by release-docker-image.yml as its gate.
#
# It must stay a check on a PUBLISHED tag, not a local build - a registry round trip is exactly what changes
# compression, manifest shape and attestation handling.
#
# config/smoke.just decides what gets asserted; adding a profile is one edit there plus one step below. The
# structure check runs once rather than per profile because it reads the image, not a container.

name: Smoke Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to smoke, with tag (e.g. binacle/binacle-net:3.0.0-beta.2)'
        required: true
        type: string
  # Same input as the manual trigger, so `inputs.image` serves both and the release path runs the exact steps
  # a maintainer runs by hand.
  workflow_call:
    inputs:
      image:
        description: 'Image to smoke, with tag'
        required: true
        type: string

jobs:
  smoke:
    # Pinned, NOT ubuntu-latest. hurl links libxml2.so.2 and Ubuntu 26.04 ships only libxml2.so.16 with no
    # compat package, so hurl dies there with what reads like a hurl bug (DEVELOPMENT.md has the workaround).
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      # Read once so every step below smokes the same thing.
      IMAGE: ${{ inputs.image }}

    steps:
      - uses: actions/checkout@v4

      # 1.x range: ubuntu's apt ships a just too old to parse config/smoke.just.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      # Pinned versions, installed exactly as DEVELOPMENT.md says, so CI and a laptop get the same bytes. Not
      # cached on purpose: a cache key can go stale against the version it is meant to pin.
      - name: Install smoke tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/cst \
            https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          install -m0755 /tmp/cst "$HOME/.local/bin/container-structure-test"
          curl -fsSL -o /tmp/hurl.tar.gz \
            https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/hurl.tar.gz -C /tmp
          install -m0755 /tmp/hurl-8.0.1-x86_64-unknown-linux-gnu/bin/hurl "$HOME/.local/bin/hurl"
          # ~/.local/bin is on PATH for an interactive shell but not for later workflow steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          just --version
          container-structure-test version
          hurl --version

      # Its own step so "that tag does not exist" is one red line instead of five broken-looking profiles.
      - name: Pull the image
        id: pull
        run: docker pull "$IMAGE"

      # !cancelled() so every profile still runs after one fails - you see all the red, not just the first.
      # Also gated on the pull: six failures that all mean "no image" is noise.
      - name: Smoke - image structure
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test-structure "$IMAGE"

      - name: Smoke - minimal
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test minimal "$IMAGE"

      - name: Smoke - quickstart
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test quickstart "$IMAGE"

      - name: Smoke - prod
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test prod "$IMAGE"

      - name: Smoke - service
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test service "$IMAGE"

      - name: Smoke - full
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test full "$IMAGE"
