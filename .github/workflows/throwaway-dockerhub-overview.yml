# THROWAWAY. Proves the Docker Hub description can be written from CI, and shows the rendered page, before
# any of this goes into release-docker-image.yml. Delete this file once the real step exists.
#
# Run it once with publish=false: it renders the page into the run summary without
# touching anything. Read it, then run again with publish=true. The undo is the backup in the scratchpad.

name: THROWAWAY - Docker Hub overview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fills {{VERSION}}
        required: true
        default: 3.0.0-beta.4
      minor:
        description: Fills {{MINOR}}. Give it a tag that EXISTS - the page goes live on publish
        required: true
        default: 3.0.0-beta.4
      secret_name:
        description: Which secret to authenticate with
        required: true
        default: DOCKERHUB_TOKEN
        type: choice
        options:
          - DOCKERHUB_TOKEN
          - DOCKERHUB_DESC_TOKEN
      publish:
        description: Write the live page. Leave off to render only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  overview:
    name: Render and publish the overview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the page
        env:
          VERSION: ${{ inputs.version }}
          MINOR: ${{ inputs.minor }}
        run: |
          set -euo pipefail
          sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{MINOR}}/${MINOR}/g" \
            .github/dockerhub-overview.md > "$RUNNER_TEMP/overview.md"
          # A raw placeholder on a public landing page is worse than a failed run.
          if grep -n '{{' "$RUNNER_TEMP/overview.md"; then
            echo "^ unsubstituted placeholder"; exit 1
          fi
          {
            echo "## Rendered - $(wc -c < "$RUNNER_TEMP/overview.md") bytes, publish=${{ inputs.publish }}"
            echo '<details><summary>What would be published</summary>'
            echo
            echo '```markdown'
            cat "$RUNNER_TEMP/overview.md"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Indexed rather than named, so a second token can be tried without editing this file. An unset secret
      # reads as empty and the action would 401 on it, which says nothing useful.
      - name: Check the secret exists
        if: ${{ inputs.publish }}
        env:
          PASSWORD: ${{ secrets[inputs.secret_name] }}
        run: |
          [ -n "$PASSWORD" ] || { echo "${{ inputs.secret_name }} is not set on this repo"; exit 1; }

      # short-description is left unset on purpose - the action only writes that field when the input is
      # non-empty, and the live one is already correct.
      - name: Publish the overview
        if: ${{ inputs.publish }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets[inputs.secret_name] }}
          repository: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
          readme-filepath: ${{ runner.temp }}/overview.md

      - name: Where to look
        if: ${{ inputs.publish }}
        run: echo "https://hub.docker.com/r/${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}" >> "$GITHUB_STEP_SUMMARY"
