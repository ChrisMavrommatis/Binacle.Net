#   changes -> test suite, image build, workflow lint -> gate
#
# `gate` is the only name branch protection holds. Never move the image build into the test suite - the release
# calls that file whole and would build a throwaway image every time.

name: Pull Request

on:
  pull_request:

# Cancellable: a superseded run leaves nothing behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Work out what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.paths.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The three-dot diff below needs the merge base, which a shallow clone does not have.
          fetch-depth: 0

      # Three dots, not two: with two, a commit landing on main reads as a change in every open pull request.
      - name: List the changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...$HEAD" | tee /tmp/changed.txt
          if grep -qvE '^(\.agents/|docs/|web/)|\.md$' /tmp/changed.txt; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  test-suite:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/shared-test-suite.yml
    permissions:
      contents: read

  image:
    name: Image build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Setup - .NET
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      # The recipe the release builds through, so this proves that path. No login, no push, no credentials.
      - name: Build - image
        run: just build image

  workflows:
    name: Workflow lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Install - actionlint
        uses: ./.github/actions/install-actionlint

      - name: Check - workflows
        run: just check workflows

      - name: Check - actions
        if: ${{ !cancelled() }}
        run: just check actions

  gate:
    name: Gate
    needs: [ changes, test-suite, image, workflows ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # Read every result: a bare always() passes while its dependencies are red.
      - name: Check every job above
        env:
          # Name and result in pairs, so the summary below can say which job did what.
          RESULTS: >-
            changes:${{ needs.changes.result }}
            tests:${{ needs.test-suite.result }}
            image:${{ needs.image.result }}
            workflows:${{ needs.workflows.result }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo '| Job | Result |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in $RESULTS; do
            job="${pair%%:*}"
            result="${pair##*:}"
            echo "| \`$job\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$job reported '$result'."
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**The gate failed.** A job above did not succeed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Every job succeeded or was skipped."
