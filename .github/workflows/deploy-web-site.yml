name: Deploy Web Site

on:
  workflow_dispatch:

# Never cancelled: a stopped deploy leaves App Platform mid-rollout and no marker tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build - web site
        uses: ./.github/actions/build-jekyll-site
        with:
          site: web
          directory: web

      - name: Install - lychee
        uses: ./.github/actions/install-lychee

      # Offline. The absolute URLs point at pages this run has not published yet, so they all 404 here.
      - name: Check - links
        run: just check links web

  deploy:
    name: Deploy the site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No checkout: `app_name` makes App Platform use its own stored spec, and the action comes from GitHub.
    permissions: {}
    environment:
      name: binacle-net-web
      url: https://www.binacle.net

    steps:
      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: binacle-net-web

  tag:
    name: Tag the deployed commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    env:
      # Must not start with `v` followed by a digit - the release workflow fires on `v[0-9]*`.
      TAG_NAME: web-release-${{ github.run_number }}
      COMMIT: ${{ github.sha }}
      URL: https://www.binacle.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push the marker tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$COMMIT"
          git push origin "$TAG_NAME"

      - name: Summarise the deploy
        run: |
          set -euo pipefail
          # A `|` in the subject would end the table row.
          subject=$(git log -1 --format=%s "$COMMIT" | sed 's/|/\\|/g')
          {
            echo "## ${URL#https://} deployed"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Commit | \`${COMMIT:0:8}\` - ${subject} |"
            echo "| Marker tag | \`${TAG_NAME}\` |"
            echo "| Site | ${URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
