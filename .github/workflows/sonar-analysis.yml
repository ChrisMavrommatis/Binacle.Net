# Sends coverage to SonarCloud. Keep Automatic Analysis OFF in the UI: it only reads source, so it can never
# report coverage, and the two fight if both are on.
#
# Build and coverage MUST stay between begin and end - the scanner only sees projects compiled in that pair.
# A failing suite skips "Sonar end", so a broken run publishes nothing. That is deliberate.
#
# Only the key, org, token and host stay below; everything else the scanner needs is passed by `/s:`.

name: Sonar Analysis

on:
  # On merge, so every analysis sits on a real commit and the rolling 30-day new-code window is fed
  # continuously rather than in jumps. Deliberately not a schedule - a nightly run re-analyses a commit
  # nothing changed and reports the same numbers, which teaches everyone the run means nothing.
  #
  # Not on pull_request either, yet: the coverage condition is red before anyone writes a line, and a gate
  # like that gets waived within a week.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    name: Analyse and publish
    runs-on: ubuntu-latest
    # Full build plus every suite under coverage, then the upload. The slowest workflow here.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to tell new code from old. A shallow clone makes everything look new.
          fetch-depth: 0

      # The scanner is a Java program, whatever language it analyses.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Setup - .NET
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup - Node
        uses: ./.github/actions/setup-node

      - name: Install npm packages
        run: npm ci --ignore-scripts

      # Only the analyzer cache is here - the NuGet one comes with the .NET setup above. Analyzers are stable
      # between runs, so caching skips the re-download.
      - name: Cache Sonar analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Restore tools
        run: dotnet tool restore

      # Every interpolated value goes through env rather than into the command line, so nothing is pasted into
      # a shell it could change the meaning of.
      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /s:"$GITHUB_WORKSPACE/tooling/sonar-analysis.xml"

      # Build once here so the coverage run below can --no-build.
      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      - name: Coverage
        env:
          DOTNET_TEST_ARGS: --configuration Release --no-build
        run: just coverage all sonar

      # Publishes the run. Skipped on any failure above, so coverage from a broken run is never recorded.
      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
