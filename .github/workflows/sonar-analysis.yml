# Sends coverage to SonarCloud. Keep Automatic Analysis OFF in the UI: it only reads source, so it can never
# report coverage, and the two fight if both are on.
#
# Build and coverage MUST stay between begin and end - the scanner only sees projects compiled in that pair.
# A failing suite skips "Sonar end", so a broken run publishes nothing. That is deliberate.
#
# Only the key, org, token and host stay below; everything else the scanner needs is passed by `/s:`.

name: Sonar Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Full build plus every suite under coverage, then the upload. The slowest workflow here.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Sonar needs full history to tell new code from old. A shallow clone makes everything look new.
          fetch-depth: 0

      # The scanner is a Java program, whatever language it analyses.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Analyzers and NuGet packages are stable between runs — cache to skip the re-download.
      - name: Cache Sonar analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # 1.x range: ubuntu's apt ships a just too old to parse this repo's module files.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      - name: Restore tools
        run: dotnet tool restore

      # --ignore-scripts stops a dependency running arbitrary code at install time. See run-tests.yml.
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /s:"$GITHUB_WORKSPACE/tooling/sonar-analysis.xml"

      # Build once here so the coverage run below can --no-build.
      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      - name: Coverage
        env:
          DOTNET_TEST_ARGS: --configuration Release --no-build
        run: just coverage all sonar

      # Publishes the run. Skipped on any failure above, so coverage from a broken run is never recorded.
      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
