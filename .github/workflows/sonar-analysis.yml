# Sends coverage to SonarCloud. Manual, because coverage needs a CI run: Automatic Analysis only reads
# source, so it must be OFF or the two fight. Build + coverage sit between begin/end — the scanner only
# sees projects compiled in that pair. A failing suite skips "Sonar end", so a failed run publishes nothing.

name: Sonar Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to tell new code from old. A shallow clone makes everything look new.
          fetch-depth: 0

      # The scanner is a Java program, whatever language it analyses.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Analyzers and NuGet packages are stable between runs — cache to skip the re-download.
      - name: Cache Sonar analyzers
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Install npm packages
        run: npm ci

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="CoverageArtifacts/sonar/*.coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="CoverageArtifacts/sonar/ts/lcov.info"

      # Build once here so every coverage step below can --no-build.
      - name: Build
        run: |
          dotnet build Binacle.Net.slnx --configuration Release
          mkdir -p CoverageArtifacts/sonar

      # dotnet run -- --coverage is the MTP-native way to emit coverage; xml = Visual Studio coverage, the C# format
      # Sonar imports. Files land where sonar.cs.vscoveragexml.reportsPaths expects them.
      - name: Coverage — lib
        run: >
          dotnet run --project lib/test/Binacle.Lib.UnitTests --configuration Release --no-build --
          --coverage --coverage-output-format xml
          --coverage-output CoverageArtifacts/sonar/lib.coverage.xml

      - name: Coverage — api (core)
        run: >
          dotnet run --project api/test/Binacle.Net.IntegrationTests --configuration Release --no-build --
          --coverage --coverage-output-format xml
          --coverage-output CoverageArtifacts/sonar/api.coverage.xml

      # SQLite: the infra shipping first, and it needs no external service.
      - name: Coverage — servicemodule (sqlite)
        env:
          BINACLE_TEST_INFRA: Sqlite
        run: >
          dotnet run --project api/test/Binacle.Net.ServiceModule.IntegrationTests --configuration Release --no-build --
          --coverage --coverage-output-format xml
          --coverage-output CoverageArtifacts/sonar/service.coverage.xml

      - name: Coverage — vipaq
        run: >
          dotnet run --project vipaq/test/Binacle.ViPaq.UnitTests --configuration Release --no-build --
          --coverage --coverage-output-format xml
          --coverage-output CoverageArtifacts/sonar/vipaq.coverage.xml

      - name: Coverage — shared (compact-notation)
        run: >
          dotnet run --project shared/test/Binacle.CompactNotation.UnitTests --configuration Release --no-build --
          --coverage --coverage-output-format xml
          --coverage-output CoverageArtifacts/sonar/compact-notation.coverage.xml

      # Run jest from the root so recorded paths carry the workspace folder; per-workspace they read as bare
      # "src/foo.ts" and Sonar resolves nothing → 0%.
      - name: Coverage — typescript
        run: >
          npx jest --coverage --coverageReporters=lcovonly
          --coverageDirectory=CoverageArtifacts/sonar/ts

      # Publishes the run. Skipped on any failure above, so coverage from a broken run is never recorded.
      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
