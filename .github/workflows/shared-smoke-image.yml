# Smokes an image that already exists on a registry: its static content, then every shipped profile end to end.
# Run by hand against any published tag, and called by release-docker-image.yml as its gate.
#
# It must stay a check on a PUBLISHED tag, not a local build - a registry round trip is exactly what changes
# compression, manifest shape and attestation handling.
#
# The structure check runs once rather than per profile because it reads the image, not a container.

#
# `shared-` because the release workflow calls it. The dispatch trigger below is the point of the file though -
# smoking any published tag by hand is a maintainer tool, not an implementation detail of the release.

name: Shared / Smoke Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to smoke, with tag (e.g. binacle/binacle-net:3.0.0)'
        required: true
        type: string
  # Same input as the manual trigger, so `inputs.image` serves both and the release path runs the exact steps
  # a maintainer runs by hand.
  workflow_call:
    inputs:
      image:
        description: 'Image to smoke, with tag'
        required: true
        type: string

jobs:
  smoke:
    name: Smoke image
    # Pinned, NOT ubuntu-latest. hurl links libxml2.so.2 and Ubuntu 26.04 ships only libxml2.so.16 with no
    # compat package, so hurl dies there with what reads like a hurl bug (DEVELOPMENT.md has the workaround).
    runs-on: ubuntu-24.04
    # Five profiles, each a container boot plus a hurl run. Twice the observed worst case.
    timeout-minutes: 30
    permissions:
      contents: read
      # For the GHCR login below. Harmless on the manual Docker Hub dispatch, which never uses it.
      packages: read

    env:
      # Read once so every step below smokes the same thing.
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      # One action per tool, each ending in its own version line, so a red step names the tool instead of
      # "smoke tools". The versions, the checksums and why these are curled rather than actioned live in the
      # two action files.
      - name: Install - container-structure-test
        uses: ./.github/actions/install-container-structure-test

      - name: Install - hurl
        uses: ./.github/actions/install-hurl

      - name: just version
        run: just --version

      # Only for a GHCR image, so the manual Docker Hub dispatch keeps working with no credential at all.
      # The staging package is public and an anonymous pull would succeed without this - it is here so the
      # smoke still works if the package is ever flipped to private, which is one click and no warning.
      - name: Login to GHCR
        if: ${{ startsWith(inputs.image, 'ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Its own step so "that tag does not exist" is one red line instead of five broken-looking profiles.
      - name: Pull the image
        id: pull
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          # The index digest, which is what the release copies - not the per-platform one `docker pull` prints.
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')" \
            >> "$GITHUB_OUTPUT"

      # !cancelled() so every profile still runs after one fails - you see all the red, not just the first.
      # Also gated on the pull: six failures that all mean "no image" is noise.
      - name: Smoke - image structure
        id: structure
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test-structure "$IMAGE"

      - name: Smoke - minimal
        id: minimal
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test minimal "$IMAGE"

      - name: Smoke - quickstart
        id: quickstart
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test quickstart "$IMAGE"

      - name: Smoke - prod
        id: prod
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test prod "$IMAGE"

      - name: Smoke - service
        id: service
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test service "$IMAGE"

      - name: Smoke - full
        id: full
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: just smoke test full "$IMAGE"

      # Only on a hand run, where this workflow IS the run. The release calls it too, and a second summary
      # block there would sit beside the one `publish` writes for no new fact.
      - name: Summarise the smoke
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          DIGEST: ${{ steps.pull.outputs.digest }}
          RESULTS: >-
            structure:${{ steps.structure.outcome }}
            minimal:${{ steps.minimal.outcome }}
            quickstart:${{ steps.quickstart.outcome }}
            prod:${{ steps.prod.outcome }}
            service:${{ steps.service.outcome }}
            full:${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Smoked \`${IMAGE}\`"
            echo
            if [ -n "$DIGEST" ]; then
              echo "**Digest** \`${DIGEST}\` - what the tag pointed at when this ran."
            else
              echo '**The pull failed.** Nothing was smoked.'
            fi
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            for pair in $RESULTS; do
              case "${pair##*:}" in
                success) mark='✅' ;;
                skipped) mark='-' ;;
                *)       mark='❌' ;;
              esac
              echo "| ${pair%%:*} | ${mark} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
