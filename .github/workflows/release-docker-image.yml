# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Release Docker Image

on:
  release:
    types: [ "published" ]

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - name: Release Tag
      run: echo "Runing release for ${{ github.ref_name }}"
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ vars.DONET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore --runtime linux-x64
    - name: Publish
      # Paths hardcoded, not Actions variables. The Dockerfile's COPY and the .dockerignore allowlist fix the
      # output to build/binacle-net, and build.just publishes the same project to the same place. A variable can
      # only drift from those two hardcoded facts and silently build an image without the app in it. Keep this
      # line in step with build.just's `publish` recipe.
      #
      # --no-self-contained since 2026-08-10. It was --self-contained while the image bases on aspnet, so every
      # published image carried two copies of .NET: the bundled one the app ran on, and the base image's, which
      # nothing loaded. Dropping it took the image from 150.2 MB to 103.2 MB, measured locally, with all 31
      # structure assertions and all five smoke profiles green. It also means a .NET security fix reaches users
      # by rebasing on a newer aspnet tag rather than by republishing the app.
      run: dotnet publish api/src/Binacle.Net/Binacle.Net.csproj -c Release -o build/binacle-net --no-restore --no-self-contained --runtime linux-x64
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: |
          ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
        # {{version}} is the immutable pin (3.0.0). {{major}}.{{minor}} is the moving one (3.0 -> newest 3.0.x),
        # which is what the samples pin: a copied sample then inherits bug fixes and never a breaking change.
        # A prerelease gets neither: metadata-action skips {{major}}.{{minor}} for a prerelease tag, the same
        # guard as latest=auto below, so v3.0.0-beta.1 publishes only 3.0.0-beta.1. Verify on the first beta.
        # No {{major}} tag on purpose: "3" would cross minor lines, and nothing here should pin it.
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        # Corrects the two labels metadata-action gets wrong on its own, both of which override the Dockerfile
        # at build time. licenses: auto-detection returns NOASSERTION because the repo is dual-licensed. url:
        # auto-fills the repo, but the image should point at the landing site. Every other label (title,
        # description, source, revision, created, version) is left to metadata-action, and documentation/vendor
        # /base.name come from the Dockerfile.
        labels: |
          org.opencontainers.image.licenses=GPL-3.0-only AND CC-BY-SA-4.0
          org.opencontainers.image.url=https://www.binacle.net
        # latest=auto is the default; it is written out because the beta depends on it. Under auto, "latest" is
        # applied only when the semver tag is not a prerelease, so publishing v3.0.0-beta.1 must not move
        # "latest" onto the beta and drag sample users onto it. Verify this on the first beta tag.
        flavor: |
          latest=auto
    - name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - name: Build and push
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ${{ vars.BUILD_DOCKERFILE }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Was github.ref_name, which put "v3.0.0" in BINACLE_VERSION while the image tag said "3.0.0". Both now
        # come from the same stripped value, so the version the container reports matches the tag you pulled.
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
      
