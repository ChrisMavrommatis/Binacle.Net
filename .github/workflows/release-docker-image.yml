# Six jobs, cheapest check first:
#
#   push tag v3.0.0 -> notes gate -> test -> build+push GHCR -> smoke -> copy to Docker Hub -> release
#
# Three things to know before you change anything here:
#
#   - Never rebuild the image between `build` and `publish`. The copy is by digest, which is what makes the
#     published image bit for bit the one `smoke` passed. A rebuild ships something nothing tested.
#   - cosign runs twice on purpose. A signature is a referrer, not part of the index, so it does not survive
#     the copy and has to be made again where the image lands.
#   - Do NOT add `release: published` as a second trigger. The release created in the last job would re-enter
#     this workflow and build everything twice.

name: Build and Release Docker Image

on:
  push:
    tags:
      # `v` then a DIGIT, not the looser `v*`: the two deploy workflows push `docs-release-<run>` and
      # `web-release-<run>`, and a release build must never fire on one. Any new tag-pushing workflow has to
      # stay out of the `v<digit>` namespace.
      - 'v[0-9]*'

permissions:
  contents: read

env:
  # GHCR rejects an uppercase path and the owner here is mixed case, so it is written out lowercase rather
  # than derived from github.repository_owner at runtime.
  STAGING_IMAGE: ghcr.io/chrismavrommatis/binacle-net

jobs:
  # FIRST, and everything waits on it. The release body has to exist before anything is built, because the
  # alternative is discovering it at the end - with the image already on Docker Hub and `latest` moved, and
  # no release to describe it. A grep costs seconds; that costs a bad release.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      section: ${{ steps.section.outputs.name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      # A beta publishes the in-progress section; a real release publishes its own. The heading is renamed
      # from [Unreleased] to the version as the last edit before the real tag.
      - name: Which section this tag publishes
        id: section
        run: |
          TAG='${{ github.ref_name }}'
          case "$TAG" in
            *-*) echo "name=Unreleased" >> "$GITHUB_OUTPUT" ;;
            *)   echo "name=${TAG#v}"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check the section exists
        run: just changelog check '${{ steps.section.outputs.name }}'

  # Nothing guarantees the tag sits on a commit that passed CI - you can tag anything. This is that guarantee,
  # and it reuses the PR workflow rather than restating the leaves.
  #
  # After the gate, not beside it: the gate is seconds and this is minutes, so a missing changelog section
  # should not cost a full suite run before it is reported.
  test:
    needs: notes
    uses: ./.github/workflows/run-tests.yml
    permissions:
      contents: read

  build:
    needs: [ notes, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing. cosign exchanges this OIDC token for a short-lived certificate, so there is no key
      # to store and none to rotate.
      id-token: write

    outputs:
      staging: ${{ steps.ref.outputs.staging }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      # 1.x range: ubuntu's apt ships a just too old to parse config/build.just.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      # config/build.just owns the project, the output folder and --no-self-contained, so CI and a laptop build
      # the same thing. Do not inline restore/publish here again.
      - name: Publish
        run: just build publish

      # One metadata step now, not two: only the immutable tag is pushed here. The moving tags are computed in
      # `publish`, which is the only job that creates them.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.STAGING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          # The only two labels metadata-action gets wrong: licenses auto-detects to NOASSERTION on a
          # dual-licensed repo, and url auto-fills the repo instead of the landing site.
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only AND CC-BY-SA-4.0
            org.opencontainers.image.url=https://www.binacle.net

      - name: Assemble the staging reference
        id: ref
        run: echo "staging=${STAGING_IMAGE}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is minted for this run and expires with it, so staging needs no stored credential.
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # file: is the literal Dockerfile at the repo root - there is exactly one, so a repo variable could only
      # drift from it.
      - name: Build and push to staging
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stated explicitly, not left to buildx's defaults, so it stays a choice. mode=max records the full
          # build definition; the only build arg is VERSION, so nothing secret is captured - revisit this
          # before adding a secret-bearing one. Both make the artifact an OCI index, which the copy carries
          # whole.
          provenance: mode=max
          sbom: true
          # metadata-action's version, never github.ref_name: the latter would put "v3.0.0" in BINACLE_VERSION
          # while the image tag said "3.0.0".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the DIGEST, not a tag, so the signature covers the artifact rather than a name that can move.
      #
      # Attached as an OCI 1.1 referrer - fallback tag `sha256-<digest>`, NO `.sig` suffix; older cosign made
      # those, this one does not. A referrer is not inside the index, so it does not survive the copy, which is
      # why `publish` signs again.
      - name: Sign the staging image
        env:
          TARGET: ${{ steps.ref.outputs.staging }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$TARGET"

  # The gate. Calls smoke-image.yml rather than copying its steps, so the release path runs exactly what a
  # maintainer runs by hand. Red here means nothing reaches Docker Hub and no release is created.
  smoke:
    needs: build
    uses: ./.github/workflows/smoke-image.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.staging }}

  # The only job that touches Docker Hub, and the only place the stored credential is used. `imagetools create`
  # ships with the runner, so no third-party tool moves the artifact users pull.
  #
  # Runs for EVERY tag. A prerelease is narrowed by the metadata step below, not by a condition here: it emits
  # only the immutable tag, because metadata-action withholds {{major}}.{{minor}} and latest=auto withholds
  # latest. Do not add a job-level skip - `smoke` already guarantees nothing unsmoked gets here, and a skip
  # only makes betas unpullable from Docker Hub.
  #
  # No `contents` permission: this job never checks out.
  publish:
    needs: [ build, smoke ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
      # Keyless signing again - see the build job. The signature does not survive the copy, so the Docker Hub
      # artifact has to be signed where it lands.
      id-token: write

    steps:
      # Computes the Docker Hub tag set. This job only runs for a real release, so all three apply - but
      # metadata-action still owns the semver parsing rather than this file hand-rolling it.
      - name: Docker metadata - public tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # `imagetools create` transfers a manifest rather than rebuilding, so the digest is preserved and Docker
      # Hub serves exactly what `smoke` passed. Reading SOURCE by DIGEST keeps that true even if something
      # re-tagged staging. All tags go in one command - they alias one manifest, so the blobs move once.
      - name: Copy the smoked digest to Docker Hub
        env:
          SOURCE: ${{ needs.build.outputs.staging }}@${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tags+=("$tag")
            args+=(-t "$tag")
          done <<< "$TAGS"
          echo "Copying ${SOURCE} to: ${tags[*]}"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          # Read back where each tag landed. All three must equal the digest the smoke job passed; this is the
          # only evidence in the log that the copy preserved it.
          for tag in "${tags[@]}"; do
            echo -n "${tag} -> "
            docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}'
          done

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Against the digest, so one signature covers every public tag aliasing it. Not a duplicate of the build
      # job's - a GHCR signature does not come across with the copy, and this is the one users verify.
      - name: Sign the published image
        env:
          TARGET: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}@${{ needs.build.outputs.digest }}
        run: cosign sign --yes "$TARGET"

  # Last, so the release never describes an image that failed to build, smoke or publish. `needs` includes
  # `notes` because this reads that job's output.
  #
  # If any job above ever becomes conditional, this needs `if: !failure() && !cancelled()` - a skipped
  # dependency skips everything downstream, and a beta would silently get no release.
  release:
    needs: [ notes, test, build, smoke, publish ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      # The section was already proven to exist by the `notes` job, so this only formats and publishes it.
      # `extract` promotes the section's headings back to h2 - in the file they sit at h3, nested under the
      # version heading, and a release body has no such parent.
      #
      # Create OR edit, because the release may already exist. GitHub's web UI cannot create a bare tag: the
      # only way to tag from the site is to publish a release, which creates both at once. That is a normal way
      # to start this pipeline, and a plain `gh release create` would fail on it after everything else had
      # already succeeded - image pushed, tags moved, signed - leaving one red job and a hand-typed body.
      # Editing instead means the body always comes from CHANGELOG.md however the tag was made.
      #
      # The prerelease flag is set explicitly in both directions rather than only when true, so a release
      # marked prerelease by hand in the UI is corrected for a real version tag.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SECTION: ${{ needs.notes.outputs.section }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) pre=true  ;;
            *)   pre=false ;;
          esac
          just changelog extract "$SECTION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - replacing its body with the ${SECTION} section."
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$pre"
          else
            echo "Creating release ${TAG} from the ${SECTION} section."
            if [ "$pre" = true ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          fi
