# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Release Docker Image

on:
  release:
    types: [ "published" ]

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - name: Release Tag
      run: echo "Runing release for ${{ github.ref_name }}"
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ vars.DONET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore --runtime linux-x64
    - name: Publish
      run: dotnet publish ${{ vars.API_PROJECT_PATH }} -c Release -o ${{ vars.BUILD_OUTPUT }} --no-restore --self-contained --runtime linux-x64
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
        # {{version}} is the immutable pin (3.0.0). {{major}}.{{minor}} is the moving one (3.0 -> newest 3.0.x),
        # which is what the samples pin: a copied sample then inherits bug fixes and never a breaking change.
        # A prerelease gets neither: metadata-action skips {{major}}.{{minor}} for a prerelease tag, the same
        # guard as latest=auto below, so v3.0.0-beta.1 publishes only 3.0.0-beta.1. Verify on the first beta.
        # No {{major}} tag on purpose: "3" would cross minor lines, and nothing here should pin it.
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        # Corrects the two labels metadata-action gets wrong on its own, both of which override the Dockerfile
        # at build time. licenses: auto-detection returns NOASSERTION because the repo is dual-licensed. url:
        # auto-fills the repo, but the image should point at the landing site. Every other label (title,
        # description, source, revision, created, version) is left to metadata-action, and documentation/vendor
        # /base.name come from the Dockerfile.
        labels: |
          org.opencontainers.image.licenses=GPL-3.0-only AND CC-BY-SA-4.0
          org.opencontainers.image.url=https://www.binacle.net
        # latest=auto is the default; it is written out because the beta depends on it. Under auto, "latest" is
        # applied only when the semver tag is not a prerelease, so publishing v3.0.0-beta.1 must not move
        # "latest" onto the beta and drag sample users onto it. Verify this on the first beta tag.
        flavor: |
          latest=auto
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ vars.BUILD_DOCKERFILE }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Was github.ref_name, which put "v3.0.0" in BINACLE_VERSION while the image tag said "3.0.0". Both now
        # come from the same stripped value, so the version the container reports matches the tag you pulled.
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
      
