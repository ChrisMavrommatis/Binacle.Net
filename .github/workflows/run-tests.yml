# Runs every test leaf on PR. One job so setup + build happen once; each leaf is its own step, so a red check
# names the one suite that broke. ServiceModule runs once per backend as duplicated steps (Sqlite, Postgres) —
# cheaper than a matrix job at this count, and each backend is an obvious line.
#
# Every step is a `just test <leaf>` call, so the `run:` line of a red step is what you paste into a terminal to
# reproduce it. The leaves live in config/tests.just, which is the only place that knows which project a leaf
# maps to — adding a suite is one edit there plus one step here, and neither half can drift into "green in CI,
# missing locally".
#
# DOTNET_TEST_ARGS is set for the whole job: CI builds the solution once and every leaf runs against that
# build. Unset on a laptop, so the same recipes do a plain `dotnet test`.

name: Run Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOTNET_TEST_ARGS: --configuration Release --no-build

    # Postgres is up for the whole job so the ServiceModule (Postgres) step can reach it. It sits idle during
    # the other steps — a trivial cost, and simpler than starting it inline.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: appuser
          POSTGRES_DB: binacle_net
          # No POSTGRES_PASSWORD: this container lives for one job, is reachable only from it, and is thrown
          # away after, so there is nothing for a password to protect. Under trust it accepts any password for
          # appuser, and the ServiceModule integration tests fall back to the shared local-dev connection
          # string - password and all - so they connect unchanged.
          #
          # This removes the credential from this file, not from the repo. The same local-dev password is
          # still in config/docker-compose.yml, config/docker-compose.build.yml, the test default in
          # BinacleApi.cs and Config_Files/ServiceModule/ConnectionStrings.Development.json, where it is
          # load-bearing - that postgres does ask for it. It is the same value everywhere on purpose, and it
          # says what it is. Change it in all five or none.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d binacle_net"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned to a 1.x range: modules and `set working-directory` need a recent just, and ubuntu-latest's apt
      # ships one too old to parse config/tests.just.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # --ignore-scripts stops a dependency running arbitrary code at install time. Nothing here needs the
      # lifecycle hooks: no workspace declares prepare/postinstall, and the one dependency with an install
      # script is fsevents, which is darwin-only and never installed on this runner.
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      # if: !cancelled() so every leaf still runs after one fails — you see all red leaves, not just the first.
      # The cheap unit leaves come first, so an obvious break shows up before the integration hosts start.
      - name: Test - Lib (Unit)
        if: ${{ !cancelled() }}
        run: just test lib-unit

      - name: Test - Shared [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-cs-unit

      - name: Test - Shared [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-ts-unit

      - name: Test - ViPaq [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-cs-unit

      - name: Test - ViPaq [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-ts-unit

      - name: Test - API Core (Unit)
        if: ${{ !cancelled() }}
        run: just test api-core-unit

      - name: Test - API Kernel (Unit)
        if: ${{ !cancelled() }}
        run: just test api-kernel-unit

      - name: Test - API Diagnostics (Unit)
        if: ${{ !cancelled() }}
        run: just test api-diagnostics-unit

      - name: Test - API Service (Unit)
        if: ${{ !cancelled() }}
        run: just test api-service-unit

      - name: Test - API Core (Integration)
        if: ${{ !cancelled() }}
        run: just test api-core-integration

      # The backend is the recipe's argument, so it sets BINACLE_TEST_INFRA itself and rejects a typo instead
      # of falling through to the default and reporting a green run for a backend nobody exercised.
      - name: Test - API Service [Sqlite] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Sqlite

      - name: Test - API Service [Postgres] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Postgres
