# Runs every test leaf on PR. One job so setup and build happen once; one step per leaf so a red check names
# the suite. ServiceModule is duplicated steps per backend rather than a matrix - cheaper at this count.
#
# config/tests.just is the only place that knows which project a leaf maps to, so adding a suite is one edit
# there plus one step here and the two halves cannot drift into "green in CI, missing locally".
#
# DOTNET_TEST_ARGS is job-wide: CI builds the solution once and every leaf runs --no-build against it. Unset
# on a laptop, where the same recipes do a plain `dotnet test`.

name: Run Tests

on:
  pull_request:
  workflow_dispatch:
  # Takes no inputs - the release workflow calls it as its "this commit passed CI" gate, and it needs the
  # same run a PR gets, not a variant of it.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DOTNET_TEST_ARGS: --configuration Release --no-build

    # Up for the whole job so the ServiceModule (Postgres) step can reach it. Idle during the others, which is
    # cheaper than starting it inline.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: appuser
          POSTGRES_DB: binacle_net
          # No POSTGRES_PASSWORD: this container lives for one job, is reachable only from it, and is thrown
          # away after, so there is nothing for a password to protect. Under trust it accepts any password, so
          # the tests connect unchanged with the shared local-dev connection string.
          #
          # That local-dev password is still load-bearing in config/docker-compose.yml,
          # config/docker-compose.build.yml, BinacleApi.cs and ConnectionStrings.Development.json. It is the
          # same value everywhere on purpose - change it in all of them or none.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d binacle_net"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # 1.x range: ubuntu's apt ships a just too old to parse config/tests.just.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # --ignore-scripts stops a dependency running arbitrary code at install time. Nothing here needs the
      # hooks: no workspace declares prepare/postinstall.
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      # !cancelled() so every leaf still runs after one fails - you see all the red, not just the first. Cheap
      # unit leaves first, so an obvious break shows up before the integration hosts start.
      - name: Test - Lib (Unit)
        if: ${{ !cancelled() }}
        run: just test lib-unit

      - name: Test - Shared [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-cs-unit

      - name: Test - Shared [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-ts-unit

      - name: Test - ViPaq [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-cs-unit

      - name: Test - ViPaq [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-ts-unit

      - name: Test - API Core (Unit)
        if: ${{ !cancelled() }}
        run: just test api-core-unit

      - name: Test - API Kernel (Unit)
        if: ${{ !cancelled() }}
        run: just test api-kernel-unit

      - name: Test - API Diagnostics (Unit)
        if: ${{ !cancelled() }}
        run: just test api-diagnostics-unit

      - name: Test - API Service (Unit)
        if: ${{ !cancelled() }}
        run: just test api-service-unit

      - name: Test - API Core (Integration)
        if: ${{ !cancelled() }}
        run: just test api-core-integration

      # The backend is the recipe's argument, so a typo is rejected instead of falling through to the default
      # and reporting green for a backend nobody exercised.
      - name: Test - API Service [Sqlite] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Sqlite

      - name: Test - API Service [Postgres] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Postgres
