# Runs every test leaf on PR, plus the OpenAPI lint. One job so setup and build happen once; one step per leaf
# so a red check names the suite. ServiceModule is duplicated steps per backend rather than a matrix - cheaper at this count, and
# all three backends run here, so none of them ships on a hand-run.
#
# DOTNET_TEST_ARGS is job-wide: CI builds the solution once and every leaf runs --no-build against it. Unset
# on a laptop, where the same recipes do a plain `dotnet test`.

name: Run Tests

on:
  pull_request:
  workflow_dispatch:
  # Takes no inputs - the release workflow calls it as its "this commit passed CI" gate, and it needs the
  # same run a PR gets, not a variant of it.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DOTNET_TEST_ARGS: --configuration Release --no-build

    # Up for the whole job so the ServiceModule backend steps can reach them. Idle during the others, which is
    # cheaper than starting them inline.
    services:
      # Table storage on 10002 is the only endpoint the tests use; the other two are mapped because the
      # emulator's "UseDevelopmentStorage=true" shorthand names all three, and a missing one reads as a
      # connection failure rather than as an unused port.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        # nc, not curl: the image is alpine-based and ships busybox, not curl. A plain port check is enough -
        # the emulator serves as soon as it listens.
        options: >-
          --health-cmd "nc -z 127.0.0.1 10002"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: appuser
          POSTGRES_DB: binacle_net
          # No POSTGRES_PASSWORD: this container lives for one job, is reachable only from it, and is thrown
          # away after, so there is nothing for a password to protect. Under trust it accepts any password, so
          # the tests connect unchanged with the shared local-dev connection string.
          #
          # That local-dev password is still load-bearing in the local compose stacks, BinacleApi.cs and
          # ConnectionStrings.Development.json. It is the same value everywhere on purpose - change it in all
          # of them or none.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d binacle_net"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # 1.x range: ubuntu's apt ships a just too old to parse this repo's module files.
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '^1.45'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # --ignore-scripts stops a dependency running arbitrary code at install time. Nothing here needs the
      # hooks: no workspace declares prepare/postinstall.
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      # Not a test leaf, and it does its own build - the recipe generates the documents from the API project
      # before linting them. It sits here rather than in a PR-only workflow so the release, which calls this
      # file whole, checks the specs too.
      - name: Lint - OpenAPI documents
        if: ${{ !cancelled() }}
        run: just openapi lint

      # !cancelled() so every leaf still runs after one fails - you see all the red, not just the first. Cheap
      # unit leaves first, so an obvious break shows up before the integration hosts start.
      - name: Test - Lib (Unit)
        if: ${{ !cancelled() }}
        run: just test lib-unit

      - name: Test - Shared [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-cs-unit

      - name: Test - Shared [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test shared-ts-unit

      - name: Test - ViPaq [cs] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-cs-unit

      - name: Test - ViPaq [ts] (Unit)
        if: ${{ !cancelled() }}
        run: just test vipaq-ts-unit

      - name: Test - API Core (Unit)
        if: ${{ !cancelled() }}
        run: just test api-core-unit

      - name: Test - API Kernel (Unit)
        if: ${{ !cancelled() }}
        run: just test api-kernel-unit

      - name: Test - API Diagnostics (Unit)
        if: ${{ !cancelled() }}
        run: just test api-diagnostics-unit

      - name: Test - API Service (Unit)
        if: ${{ !cancelled() }}
        run: just test api-service-unit

      - name: Test - API Core (Integration)
        if: ${{ !cancelled() }}
        run: just test api-core-integration

      # The backend is the recipe's argument, so a typo is rejected instead of falling through to the default
      # and reporting green for a backend nobody exercised.
      - name: Test - API Service [Sqlite] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Sqlite

      - name: Test - API Service [Postgres] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration Postgres

      - name: Test - API Service [AzureStorage] (Integration)
        if: ${{ !cancelled() }}
        run: just test api-service-integration AzureStorage
