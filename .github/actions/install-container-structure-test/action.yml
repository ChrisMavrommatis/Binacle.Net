name: Install container-structure-test
description: Install the container-structure-test binary, pinned by version and SHA-256.

runs:
  using: composite
  steps:
    - name: Install container-structure-test
      shell: bash
      env:
        # Keep in step with DEVELOPMENT.md, so CI and a laptop get the same bytes.
        VERSION: v1.22.1
        # Upstream publishes none - taken from the binary in use. It proves later downloads match that one,
        # not that it was genuine.
        SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
      # ~/.local/bin is on PATH for an interactive shell but not for later steps, hence GITHUB_PATH.
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o /tmp/cst \
          "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${VERSION}/container-structure-test-linux-amd64"
        echo "${SHA256}  /tmp/cst" | sha256sum -c -
        install -m0755 /tmp/cst "$HOME/.local/bin/container-structure-test"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/container-structure-test" version
