name: Install lychee
description: Install the lychee binary, pinned by version and SHA-256.

runs:
  using: composite
  steps:
    - name: Install lychee
      shell: bash
      env:
        # Keep in step with DEVELOPMENT.md, so CI and a laptop get the same bytes.
        VERSION: 0.24.2
        # Published by upstream as <asset>.sha256.
        SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
      # musl, not gnu: it links nothing from the system, which is the class of problem the hurl section of
      # DEVELOPMENT.md exists for.
      #
      # ~/.local/bin is on PATH for an interactive shell but not for later steps, hence GITHUB_PATH.
      run: |
        set -euo pipefail
        ASSET="lychee-x86_64-unknown-linux-musl"
        mkdir -p "$HOME/.local/bin"
        curl --proto '=https' --proto-redir '=https' -fsSL -o /tmp/lychee.tar.gz \
          "https://github.com/lycheeverse/lychee/releases/download/lychee-v${VERSION}/${ASSET}.tar.gz"
        echo "${SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
        tar xzf /tmp/lychee.tar.gz -C /tmp
        install -m0755 "/tmp/${ASSET}/lychee" "$HOME/.local/bin/lychee"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/lychee" --version
