name: Setup just
description: Install the just task runner at the version this repo's module files need.

runs:
  using: composite
  steps:
    # Not `latest`: the range is the contract. Ubuntu's apt just cannot parse module files.
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '^1.45'
