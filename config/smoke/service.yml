name: binacle-smoke-service

# Paired with samples/docker/service/ - the same configuration, written to be copied. Different files on
# purpose: the sample pins a published image, while this one runs the image under test and carries tweaks a
# user must never inherit. Change the modules here and change them there too.

# Smoke profile `service` - Binacle.Net run as a hosted, multi-tenant service: ServiceModule on, so accounts,
# JWT auth and rate limiting, with docs, health checks and packing logs. The web UI and the /_debug endpoint
# are OFF. Its defining assertion is that /_debug is 404 while auth still works.
#
# This is `prod` plus ServiceModule and a database - the deployment shape for offering Binacle.Net to other
# people, rather than calling it from your own backend. One backend (SQLite), JwtAuth injected, and the
# anonymous rate limit raised so repeat runs do not hit 429.

configs:
  # ServiceModule validates these at startup and will not boot without them. Smoke-only secret.
  jwt_auth:
    content: |
      {
        "JwtAuth": {
          "Issuer": "https://localhost:8080",
          "Audience": "https://localhost:8080",
          "TokenSecret": "ThisIsAVerySecretKeyMeantToBeStoredSecurelyAndNotLikeThisSoPleaseChangeIt",
          "ExpirationInSeconds": 3600
        }
      }

services:
  binacle-net:
    image: ${BINACLE_IMAGE:-binacle-net:local}
    ports:
      - "8080:8080"
    configs:
      - source: jwt_auth
        target: /app/Config_Files/ServiceModule/JwtAuth.json
    environment:
      - SWAGGER_UI=True
      - SCALAR_UI=True
      - SERVICE_MODULE=True
      - HealthChecks__Enabled=True
      - PackingLogs__Enabled=True
      # UI_MODULE and DEBUG_ENDPOINT are deliberately unset - that off-state is what this profile tests.
      - SQLITE_CONNECTION_STRING=Data Source=/app/data/binacle-net-service.db;
      # A smoke concern, not a shipped default: the anonymous limit decays over an hour, so repeat runs would go
      # red with 429s. Presence is packaging, the number is behaviour.
      - RateLimiter__ApiUsageAnonymous=SlidingWindow::100000/3600-30
    volumes:
      - app_data:/app/data/

volumes:
  app_data:
