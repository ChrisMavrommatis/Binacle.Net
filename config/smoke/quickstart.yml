name: binacle-smoke-quickstart

# Smoke profile `quickstart` - the README `docker run`: docs and the web UI, no auth, no backend. Feature flags
# are exact-match True/False (case-sensitive), so all three must be exact `True`.

services:
  binacle-net:
    image: binacle-net:local
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_UI=True
      - SCALAR_UI=True
      - UI_MODULE=True
