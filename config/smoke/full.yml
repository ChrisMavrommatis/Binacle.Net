name: binacle-smoke-full

# Smoke profile `full` - the dev/demo shape the shipped example stacks turn on, plus DEBUG_ENDPOINT. Everything
# is on: the web UI serves and /_debug is deliberately 200. One backend (SQLite), JwtAuth injected, anonymous
# rate limit raised.

configs:
  jwt_auth:
    content: |
      {
        "JwtAuth": {
          "Issuer": "https://localhost:8080",
          "Audience": "https://localhost:8080",
          "TokenSecret": "ThisIsAVerySecretKeyMeantToBeStoredSecurelyAndNotLikeThisSoPleaseChangeIt",
          "ExpirationInSeconds": 3600
        }
      }

services:
  binacle-net:
    image: binacle-net:local
    ports:
      - "8080:8080"
    configs:
      - source: jwt_auth
        target: /app/Config_Files/ServiceModule/JwtAuth.json
    environment:
      - SWAGGER_UI=True
      - SCALAR_UI=True
      - UI_MODULE=True
      - SERVICE_MODULE=True
      - DEBUG_ENDPOINT=True
      - HealthChecks__Enabled=True
      - PackingLogs__Enabled=True
      - SQLITE_CONNECTION_STRING=Data Source=/app/data/binacle-net-service.db;
      - RateLimiter__ApiUsageAnonymous=SlidingWindow::100000/3600-30
    volumes:
      - app_data:/app/data/

volumes:
  app_data:
