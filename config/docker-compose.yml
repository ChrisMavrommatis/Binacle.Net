name: binacle-net-services

# Backing services only - no binacle-net. This is what `just serve api` talks to, and what the Postgres and
# AzureStorage test leaves need, so it belongs to the `serve` module rather than to `image`.
#
#   up     just serve services [-d]
#   down   just serve services-down          # keeps the database
#   wipe   just serve services-down -v       # drops the postgres volume too
#
# `up` creates ./azurite and opens it first: docker would otherwise create that bind source itself, as root,
# leaving emulator state in the repo you cannot open.
#
# Dashboard on http://localhost:18888, azurite on 10000-10002, postgres on 5432.

configs:
  asprice_dashboard_config:
    content: |
      {
        "Dashboard": {
          "TelemetryLimits": {
            "MaxLogCount": 100,
            "MaxTraceCount": 100,
            "MaxMetricsCount": 100
          },
          "Otlp": {
            "AuthMode": "ApiKey",
            "PrimaryApiKey": "local-dev-not-a-real-api-key"
          }
        }
      }



services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - '18888:18888'
      - '18889:18889'
    configs:
      - source: asprice_dashboard_config
        target: /app/config_files/aspire-dashboard-config.json
    environment:
      - DOTNET_DASHBOARD_CONFIG_FILE_PATH=config_files/aspire-dashboard-config.json
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    volumes:
      - type: bind
        source: ./azurite
        target: /data
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
  postgres:
    image: postgres:17.6
    ports:
      - '5432:5432'
    # A named volume, never a bind. Postgres chowns its data dir to its own user and locks it to 0700, which
    # leaves an unreadable folder in the repo — and `docker build` walks the whole context, so the next build
    # fails on it. Use `docker compose down -v` to wipe the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=Pl3@s3UseASt0ngP@ssw0rdN0tL!k3Th!s0n3
      - POSTGRES_DB=binacle_net

volumes:
  postgres_data:
