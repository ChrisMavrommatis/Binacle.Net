name: binacle-net-volume

# Simple — the locally built image on its own, with the ServiceModule on SQLite. No telemetry, no extra
# containers. Data and the database live in a named volume, so docker owns them and nothing container-owned
# lands in the repo. Nothing to set up: an empty volume is seeded from the image, ownership included.
#
# This file is the `volume` stack.
#
#   up    just image up volume
#   down  just image down volume                                          # keeps the data
#   wipe  just image down volume -v                                       # deletes the volume and the db
#   read  docker compose -f ./config/docker-compose.volume.yml cp binacle-net:/app/data ./out
#
# Log in as admin@binacle.net / B1n4cl3Adm!n — seeded on first start by a startup task.

configs:
  # The ServiceModule validates these options at startup, so it will not boot without them.
  jwt_auth:
    content: |
      {
        "JwtAuth": {
          "Issuer": "https://localhost:8080",
          "Audience": "https://localhost:8080",
          "TokenSecret": "ThisIsAVerySecretKeyMeantToBeStoredSecurelyAndNotLikeThisSoPleaseChangeIt",
          "ExpirationInSeconds": 3600
        }
      }

services:
  binacle-net:
    image: binacle-net:local
    ports:
      - "8080:8080"
    configs:
      - source: jwt_auth
        target: /app/Config_Files/ServiceModule/JwtAuth.json
    volumes:
      - app_data:/app/data/
    environment:
      - SWAGGER_UI=True
      - SCALAR_UI=True
      - UI_MODULE=True
      - SERVICE_MODULE=True
      - HealthChecks__Enabled=True
      - PackingLogs__Enabled=True
      # Storage providers are tried in order — AzureStorage, Postgres, Sqlite — and the first one with a
      # connection string wins. This is the only one set, so SQLite it is.
      - SQLITE_CONNECTION_STRING=Data Source=/app/data/binacle-net-service.db;
      - BINACLEAPI_CONNECTION_STRING=endpoint=http://localhost:8080/

volumes:
  app_data:
